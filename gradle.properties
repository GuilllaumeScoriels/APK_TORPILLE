# Rle :
# - Centralise des options Gradle (performance, compatibilits, flags Android).
#
# Composants typiques :
# - android.useAndroidX : force l?utilisation d?AndroidX.
# - org.gradle.jvmargs : mmoire/GC pour viter des OOM lors des builds.
#
# Pourquoi comme a :
# - Ces paramtres vitent des problmes de build et acclrent la compilation
#   sans ?polluer? les scripts Gradle par des options rptes.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Stabilise la compilation Kotlin sur certaines machines/Android Studio
# où le Kotlin compile daemon se ferme au démarrage.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx2048m
org.gradle.configuration-cache=false
